name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  publish:
    name: Publish to npm
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # npm Trusted Publishing (OIDC): GitHub proves its identity to npm with a
    # short-lived token minted per run. No npm token is stored in GitHub.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # ships npm 11, required for trusted publishing
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Ensure latest npm (trusted publishing + npm stage)
        run: npm install -g npm@latest && npm --version
      - run: npm ci

      - name: Check if version is already published
        id: version
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm, skipping publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing $NAME@$VERSION"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.version.outputs.publish == 'true'
        run: npm run build:prod

      # The trusted publisher on npm only allows staging. The release goes live
      # once approved with 2FA: npm stage list, then npm stage approve <stage-id>.
      - name: Stage release on npm
        if: steps.version.outputs.publish == 'true'
        run: npm stage publish . --access public
